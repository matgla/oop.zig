name: oop.zig Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  execute_unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'recursive'
      - name: Execute tests
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/tristanisham/zvm/master/install.sh | bash
          # zvm's release tarball ships the binary as 0644, so the freshly
          # extracted zvm is not executable and every call to it dies with
          # "Permission denied". Harmless once upstream restores the mode bit.
          chmod +x "$HOME/.zvm/self/zvm"
          export PATH="$HOME/.zvm/bin:$HOME/.zvm/self:$PATH"
          # Zig version is pinned by .minimum_zig_version in build.zig.zon.
          ./install_zig_with_zvm.sh
          zig version
          zig build test --summary all
